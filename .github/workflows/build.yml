name: Build tvOS IPA

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project _Project/Browser.xcodeproj \
            -target Browser \
            -configuration Release \
            -sdk appletvos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-appletvos/Browser.app Payload/
          zip -qry tvOSBrowser.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: tvOSBrowser-ipa
          path: tvOSBrowser.ipa
